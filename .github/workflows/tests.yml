name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifests:
    name: manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifests agree
        run: scripts/check-manifests.sh
      - name: Drift check catches drift
        run: bash tests/check-manifests/run.sh

  mods:
    name: mod · ${{ matrix.mod }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: [bd-issue-band, crew-pane, sidekick]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code && claude --version
      - name: Validate
        run: claude plugin validate plugins/${{ matrix.mod }}
      - name: Test
        run: claude plugin test plugins/${{ matrix.mod }}
      - name: Guard tests
        if: matrix.mod == 'sidekick'
        run: python3 -m unittest discover -s plugins/sidekick/tests -v

  suites:
    name: suite · ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [fable-conductor, herdr-jutsu]
    steps:
      - uses: actions/checkout@v4
      - name: Run
        run: bash tests/${{ matrix.suite }}/run.sh
